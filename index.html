<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A guided, hands-on introduction to LiquidJava refinement types." />
    <meta name="theme-color" content="#153f34" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LiquidJava Interactive Tutorial" />
    <meta property="og:description" content="Catch the bug before it runs with four guided LiquidJava exercises." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LiquidJava Interactive Tutorial" />
    <meta name="twitter:description" content="Catch the bug before it runs with four guided LiquidJava exercises." />
    <link rel="icon" type="image/png" href="images/liquidjava-icon.png" />
    <link rel="stylesheet" href="vendor/codemirror.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>LiquidJava Interactive Tutorial</title>
  </head>
  <body>
    <a class="skip-link" href="#tutorial-main">Skip to the tutorial</a>

    <header class="site-header">
      <a class="brand" href="./" aria-label="LiquidJava Interactive Tutorial home">
        <img class="brand-mark" src="images/liquidjava-icon.png" alt="" width="42" height="42" />
        <span>
          <strong>LiquidJava</strong>
          <small>Interactive Tutorial</small>
        </span>
      </a>
      <div class="header-meta">
        <button id="reset-button" class="quiet-button" type="button">Start over</button>
      </div>
    </header>

    <div class="tutorial-shell">
      <aside class="tutorial-nav" aria-label="Tutorial progress">
        <p class="eyebrow">Your route</p>
        <nav id="step-navigation"></nav>
        <div class="progress-summary">
          <div class="progress-label">
            <span>Progress</span>
            <strong id="progress-percent">0%</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
          <p id="progress-copy">Start when you are ready.</p>
        </div>
      </aside>

      <main id="tutorial-main" class="tutorial-main" tabindex="-1">
        <div id="screen" aria-live="polite"></div>
      </main>
    </div>

    <noscript>
      <div class="noscript">This interactive tutorial needs JavaScript enabled.</div>
    </noscript>

    <script src="vendor/codemirror.js"></script>
    <script src="vendor/codemirror-clike.js"></script>
    <script src="vendor/codemirror-matchbrackets.js"></script>
    <script src="vendor/codemirror-closebrackets.js"></script>
    <script src="vendor/prism.js"></script>
    <script src="vendor/prism-java.min.js"></script>
    <script src="tutorial-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
